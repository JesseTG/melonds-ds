name: Main Workflow
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "*.gitlab-ci.yml"
      - "*.gitignore"
      - "*.github/ISSUE_TEMPLATE/**"
      - "*.github/FUNDING.yml"
      - "*.github/workflows/**"
  pull_request_target:
    branches:
      - dev
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "*.gitlab-ci.yml"
      - "*.github/ISSUE_TEMPLATE/**"
      - "*.github/FUNDING.yml"
      - "*.github/workflows/**"
  pull_request:
    # For platforms that don't run the test suite
    # (so we don't need to expose the test data repo's access token)
    branches:
      - dev
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "*.gitlab-ci.yml"
      - "*.github/ISSUE_TEMPLATE/**"
      - "*.github/FUNDING.yml"
      - "*.github/workflows/**"
  # Platforms that run the test suite need the private system files, which a fork's
  # pull_request run can't have. Keep this targeting `dev` only -- see assert-base-branch.
jobs:
  assert-base-branch:
    name: Assert Base Branch
    # `branches: [dev]` above is the only thing keeping fork cache writes out of the
    # default branch's scope, which every branch can restore from and which feeds
    # releases. Fail loudly if that filter is ever widened.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Check Base Branch
        if: github.event_name == 'pull_request_target' && github.event.pull_request.base.ref != 'dev'
        run: |
          echo "::error::pull_request_target must only target 'dev', but this run targets '${{ github.event.pull_request.base.ref }}'. Fork code would be able to write to that branch's cache scope."
          exit 1

  fetch-testfiles:
    name: Fetch Test Files
    if: github.event_name != 'pull_request'
    needs: assert-base-branch
    runs-on: ubuntu-slim
    permissions:
      actions: write
    steps:
      - name: Clone Test File Repository
        uses: actions/checkout@v4
        id: clone-test-file-repo
        with:
          repository: "${{ secrets.TESTFILE_REPO }}"
          token: "${{ secrets.TESTFILE_REPO_TOKEN }}"
          path: "testfiles"
          persist-credentials: false

      - name: Check For Existing Cache
        uses: actions/cache/restore@v4
        id: check-existing-cache
        with:
          path: |
            testfiles
            !testfiles/.git
            !testfiles/*.7z
          restore-keys: |
            testfiles
          key: "testfiles-${{ steps.clone-test-file-repo.outputs.commit }}"
          enableCrossOsArchive: true
          lookup-only: true

      - name: Prepare Test Files
        if: steps.check-existing-cache.outputs.cache-hit != 'true'
        working-directory: "${{ github.workspace }}/testfiles"
        shell: bash
        run: 7z x "${{ secrets.DSI_NAND_ARCHIVE }}"

      - name: Cache Test Files
        uses: actions/cache/save@v4
        if: steps.check-existing-cache.outputs.cache-hit != 'true'
        with:
          path: |
            testfiles
            !testfiles/.git
            !testfiles/*.7z
          key: "testfiles-${{ steps.clone-test-file-repo.outputs.commit }}"
          enableCrossOsArchive: true

    outputs:
      testfiles-cache-key: "testfiles-${{ steps.clone-test-file-repo.outputs.commit }}"

  windows:
    name: Windows (x86_64)
    uses: ./.github/workflows/pipeline.yaml
    if: github.event_name != 'pull_request' # Needs secrets; runs under pull_request_target
    needs: fetch-testfiles
    strategy:
      matrix:
        config: [ Debug, Release, RelWithDebInfo ]
    with:
      archive-name: melondsds_libretro-win32-x86_64
      runs-on: windows-latest
      info-dir: info
      shell: msys2 {0}
      test-suite: true
      testfiles-cache-key: ${{ needs.fetch-testfiles.outputs.testfiles-cache-key }}
      cmake-args: -DENABLE_SCCACHE=ON -DSCCACHE="C:/Users/runneradmin/.cargo/bin/sccache.exe" -DENABLE_LTO_RELEASE=OFF
      # Temporarily disable LTO until a regression in GCC 15 is resolved https://github.com/msys2/MINGW-packages/issues/24152
      cmake-config: "${{ matrix.config }}"
    secrets:
      TESTFILE_REPO_TOKEN: ${{ secrets.TESTFILE_REPO_TOKEN }}
      TESTFILE_REPO: ${{ secrets.TESTFILE_REPO }}
      DSI_NAND_ARCHIVE: ${{ secrets.DSI_NAND_ARCHIVE }}
      DSI_NAND: ${{ secrets.DSI_NAND }}
      ARM7_BIOS: ${{ secrets.ARM7_BIOS }}
      ARM9_BIOS: ${{ secrets.ARM9_BIOS }}
      ARM7_DSI_BIOS: ${{ secrets.ARM7_DSI_BIOS }}
      ARM9_DSI_BIOS: ${{ secrets.ARM9_DSI_BIOS }}
      NDS_FIRMWARE: ${{ secrets.NDS_FIRMWARE }}
      DSI_FIRMWARE: ${{ secrets.DSI_FIRMWARE }}
      NDS_ROM: ${{ secrets.NDS_ROM }}
      DSIWARE_ROM: ${{ secrets.DSIWARE_ROM }}
      GBA_ROM: ${{ secrets.GBA_ROM }}
      GBA_SRAM: ${{ secrets.GBA_SRAM }}

  macos-x86_64:
    name: macOS (x86_64)
    uses: ./.github/workflows/pipeline.yaml
    if: github.event_name != 'pull_request' # Needs secrets; runs under pull_request_target
    needs: fetch-testfiles
    strategy:
      matrix:
        config: [ Debug, Release, RelWithDebInfo ]
    with:
      archive-name: melondsds_libretro-macos-x86_64
      runs-on: macos-26-intel
      test-suite: true
      testfiles-cache-key: ${{ needs.fetch-testfiles.outputs.testfiles-cache-key }}
      cmake-config: "${{ matrix.config }}"
      cmake-args: -DCMAKE_OSX_ARCHITECTURES:STRING="x86_64" -DCMAKE_APPLE_SILICON_PROCESSOR="x86_64"
    secrets:
      TESTFILE_REPO_TOKEN: ${{ secrets.TESTFILE_REPO_TOKEN }}
      TESTFILE_REPO: ${{ secrets.TESTFILE_REPO }}
      DSI_NAND_ARCHIVE: ${{ secrets.DSI_NAND_ARCHIVE }}
      DSI_NAND: ${{ secrets.DSI_NAND }}
      ARM7_BIOS: ${{ secrets.ARM7_BIOS }}
      ARM9_BIOS: ${{ secrets.ARM9_BIOS }}
      ARM7_DSI_BIOS: ${{ secrets.ARM7_DSI_BIOS }}
      ARM9_DSI_BIOS: ${{ secrets.ARM9_DSI_BIOS }}
      NDS_FIRMWARE: ${{ secrets.NDS_FIRMWARE }}
      DSI_FIRMWARE: ${{ secrets.DSI_FIRMWARE }}
      NDS_ROM: ${{ secrets.NDS_ROM }}
      DSIWARE_ROM: ${{ secrets.DSIWARE_ROM }}
      GBA_ROM: ${{ secrets.GBA_ROM }}
      GBA_SRAM: ${{ secrets.GBA_SRAM }}

  macos-arm64:
    name: macOS (arm64)
    uses: ./.github/workflows/pipeline.yaml
    if: github.event_name != 'pull_request' # Needs secrets; runs under pull_request_target
    needs: fetch-testfiles
    strategy:
      matrix:
        config: [ Debug, Release, RelWithDebInfo ]
    with:
      archive-name: melondsds_libretro-macos-arm64
      runs-on: macos-latest
      test-suite: true
      testfiles-cache-key: ${{ needs.fetch-testfiles.outputs.testfiles-cache-key }}
      cmake-config: "${{ matrix.config }}"
      cmake-args: -DCMAKE_OSX_ARCHITECTURES:STRING="arm64" -DCMAKE_APPLE_SILICON_PROCESSOR="arm64"
    secrets:
      TESTFILE_REPO_TOKEN: ${{ secrets.TESTFILE_REPO_TOKEN }}
      TESTFILE_REPO: ${{ secrets.TESTFILE_REPO }}
      DSI_NAND_ARCHIVE: ${{ secrets.DSI_NAND_ARCHIVE }}
      DSI_NAND: ${{ secrets.DSI_NAND }}
      ARM7_BIOS: ${{ secrets.ARM7_BIOS }}
      ARM9_BIOS: ${{ secrets.ARM9_BIOS }}
      ARM7_DSI_BIOS: ${{ secrets.ARM7_DSI_BIOS }}
      ARM9_DSI_BIOS: ${{ secrets.ARM9_DSI_BIOS }}
      NDS_FIRMWARE: ${{ secrets.NDS_FIRMWARE }}
      DSI_FIRMWARE: ${{ secrets.DSI_FIRMWARE }}
      NDS_ROM: ${{ secrets.NDS_ROM }}
      DSIWARE_ROM: ${{ secrets.DSIWARE_ROM }}
      GBA_ROM: ${{ secrets.GBA_ROM }}
      GBA_SRAM: ${{ secrets.GBA_SRAM }}

  linux-x86_64:
    name: Linux (x86_64)
    uses: ./.github/workflows/pipeline.yaml
    if: github.event_name != 'pull_request' # Needs secrets; runs under pull_request_target
    needs: fetch-testfiles
    strategy:
      matrix:
        config: [ Debug, Release, RelWithDebInfo ]
    with:
      archive-name: melondsds_libretro-linux-x86_64
      runs-on: ubuntu-latest
      test-suite: true
      testfiles-cache-key: ${{ needs.fetch-testfiles.outputs.testfiles-cache-key }}
      cmake-config: "${{ matrix.config }}"
    secrets:
      TESTFILE_REPO_TOKEN: ${{ secrets.TESTFILE_REPO_TOKEN }}
      TESTFILE_REPO: ${{ secrets.TESTFILE_REPO }}
      DSI_NAND_ARCHIVE: ${{ secrets.DSI_NAND_ARCHIVE }}
      DSI_NAND: ${{ secrets.DSI_NAND }}
      ARM7_BIOS: ${{ secrets.ARM7_BIOS }}
      ARM9_BIOS: ${{ secrets.ARM9_BIOS }}
      ARM7_DSI_BIOS: ${{ secrets.ARM7_DSI_BIOS }}
      ARM9_DSI_BIOS: ${{ secrets.ARM9_DSI_BIOS }}
      NDS_FIRMWARE: ${{ secrets.NDS_FIRMWARE }}
      DSI_FIRMWARE: ${{ secrets.DSI_FIRMWARE }}
      NDS_ROM: ${{ secrets.NDS_ROM }}
      DSIWARE_ROM: ${{ secrets.DSIWARE_ROM }}
      GBA_ROM: ${{ secrets.GBA_ROM }}
      GBA_SRAM: ${{ secrets.GBA_SRAM }}

  linux-aarch64:
    name: Linux (arm64)
    uses: ./.github/workflows/pipeline.yaml
    if: github.event_name != 'pull_request' # Needs secrets; runs under pull_request_target
    needs: fetch-testfiles
    strategy:
      matrix:
        config: [ Debug, Release, RelWithDebInfo ]
    with:
      archive-name: melondsds_libretro-linux-arm64
      runs-on: ubuntu-22.04-arm
      test-suite: true
      testfiles-cache-key: ${{ needs.fetch-testfiles.outputs.testfiles-cache-key }}
      cmake-config: "${{ matrix.config }}"
    secrets:
      TESTFILE_REPO_TOKEN: ${{ secrets.TESTFILE_REPO_TOKEN }}
      TESTFILE_REPO: ${{ secrets.TESTFILE_REPO }}
      DSI_NAND_ARCHIVE: ${{ secrets.DSI_NAND_ARCHIVE }}
      DSI_NAND: ${{ secrets.DSI_NAND }}
      ARM7_BIOS: ${{ secrets.ARM7_BIOS }}
      ARM9_BIOS: ${{ secrets.ARM9_BIOS }}
      ARM7_DSI_BIOS: ${{ secrets.ARM7_DSI_BIOS }}
      ARM9_DSI_BIOS: ${{ secrets.ARM9_DSI_BIOS }}
      NDS_FIRMWARE: ${{ secrets.NDS_FIRMWARE }}
      DSI_FIRMWARE: ${{ secrets.DSI_FIRMWARE }}
      NDS_ROM: ${{ secrets.NDS_ROM }}
      DSIWARE_ROM: ${{ secrets.DSIWARE_ROM }}
      GBA_ROM: ${{ secrets.GBA_ROM }}
      GBA_SRAM: ${{ secrets.GBA_SRAM }}

  android:
    name: Android
    uses: ./.github/workflows/pipeline.yaml
    # These platforms take no secrets, so they run under pull_request instead of
    # pull_request_target: no elevated token, and a per-PR cache scope that lets fork
    # contributors keep incremental builds across pushes.
    #
    # The second clause skips them on same-repo PRs, where the branch's own `push` run
    # has already built them; without it those PRs would build Android/iOS/tvOS twice.
    if: >-
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      matrix:
        config: [ Debug, Release, RelWithDebInfo ]
    with:
      core-name: melondsds_libretro_android
      archive-name: melondsds_libretro-android
      cmake-config: "${{ matrix.config }}"
      cmake-args: -DENABLE_OGLRENDERER=OFF -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" -DENABLE_LTO_RELEASE=OFF
      # Disabling LTO because it causes a linker error with Clang 18.0.3 and NDK 27.2.12479018 for some reason
      # (GitHub Actions uses these at the time of writing)
      runs-on: ubuntu-latest
      # Disabled OpenGL on Android due to https://github.com/JesseTG/melonds-ds/issues/23

  ios:
    name: iOS
    uses: ./.github/workflows/pipeline.yaml
    if: >- # See the android job for why
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      matrix:
        config: [ Debug, Release, RelWithDebInfo ]
    with:
      runs-on: macos-latest
      archive-name: melondsds_libretro-ios
      info-dir: info
      cmake-config: "${{ matrix.config }}"
      cmake-args: --toolchain ./cmake/toolchain/ios.toolchain.cmake -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=14
      # Disabled OpenGL on iOS due to https://github.com/JesseTG/melonds-ds/issues/23

  tvos:
    name: tvOS
    uses: ./.github/workflows/pipeline.yaml
    if: >- # See the android job for why
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      matrix:
        config: [ Debug, Release, RelWithDebInfo ]
    with:
      runs-on: macos-latest
      archive-name: melondsds_libretro-tvos
      info-dir: info
      cmake-config: "${{ matrix.config }}"
      cmake-args: --toolchain ./cmake/toolchain/ios.toolchain.cmake -DPLATFORM=TVOS -DDEPLOYMENT_TARGET=14
      # Disabled OpenGL on tvOS due to https://github.com/JesseTG/melonds-ds/issues/23
