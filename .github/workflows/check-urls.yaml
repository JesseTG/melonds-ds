name: Validate URLs

on:
  push:
    branches:
      - main
    paths: ["**.md", "**.yaml", "**.yml", "**.cpp", "**.hpp", "**.cmake", "**.txt"]
  schedule:
    - cron: "0 0 * * *" # Run every day at midnight UTC

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate URLs
        uses: urlstechie/urlchecker-action@b643b43e2ac605e1475331c7b67247d242b7dce4 # 0.0.34
        with:
          file_types: .md,.yaml,.yml,.cpp,.hpp,.cmake,.txt
          print_all: false
          timeout: 10
          retry_count: 3
          exclude_patterns: http://nus.cdn.t.shop.nintendowifi.net/ccs/download/%08x%08x/tmd,http://www.gnu.org/licenses/,https://problemkaputt.de/gbatek.htm#dsisdmmcdsiwarefilesfromnintendosserver
