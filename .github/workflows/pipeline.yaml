name: Build Pipeline
on:
  workflow_call:
    secrets:
      TESTFILE_REPO_TOKEN:
        required: false
      TESTFILE_REPO:
        required: false
      ARM7_BIOS:
        required: false
      ARM9_BIOS:
        required: false
      ARM7_DSI_BIOS:
        required: false
      ARM9_DSI_BIOS:
        required: false
      NDS_FIRMWARE:
        required: false
      DSI_FIRMWARE:
        required: false
      NDS_ROM:
        required: false
      DSIWARE_ROM:
        required: false
      GBA_ROM:
        required: false
      GBA_SRAM:
        required: false
      DSI_NAND_ARCHIVE:
        required: false
      DSI_NAND:
        required: false
    inputs:
      cmake-args:
        description: Additional arguments to pass to CMake.
        type: string
        required: false
      core-name:
        description: The name of the core.
        type: string
        required: false
        default: melondsds_libretro
      cores-dir:
        description: The directory in which to place the built cores.
        type: string
        required: false
        default: cores
      info-dir:
        description: The directory in which to place the built info files.
        type: string
        required: false
        default: cores
      runs-on:
        description: The platform on which the workflow will be run. Passed directly to jobs.<job_id>.runs-on.
        type: string
        required: true
      shell:
        description: The shell to use for running commands. Passed directly to jobs.<job_id>.defaults.run.shell.
        type: string
        required: false
        default: bash
      build-dir:
        description: The directory in which to build the project.
        type: string
        required: false
        default: "build"
      dist-dir:
        description: The directory in which to place the built artifacts.
        type: string
        required: false
        default: "dist"
      archive-name:
        description: The name of the archive to upload.
        type: string
        required: true
      test-suite:
        description: Whether there will be a test suite based on this run's output
        type: boolean
        required: false
        default: false
      testfiles-cache-key:
        type: string
        required: false
      cmake-config:
        description: The CMake configuration to use.
        type: string
        required: true
env:
  BUILD_DIR: "${{ github.workspace }}/${{ inputs.build-dir }}"
  DIST_DIR: "${{ github.workspace }}/${{ inputs.dist-dir }}"
  TESTFILE_DIR: "${{ github.workspace }}/testfiles"

  # Whether this run may write to the Actions cache.
  #
  # A pull_request_target run is attributed to the base branch, so anything it saves
  # lands in that branch's cache scope where trusted builds will read it back. When the
  # PR comes from a fork we're building untrusted code, so it must not save anything.
  # (Cache writes aren't governed by `permissions:`, so this is the only control.)
  #
  # pull_request is deliberately allowed: those runs are scoped to refs/pull/N/merge,
  # which nothing else can restore from.
  CAN_WRITE_CACHE: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository }}

  # Shared by the cached and uncached Linux dependency steps below; keep them in sync.
  APT_PACKAGES: ccache cmake libepoxy-dev libopengl0 libopengl-dev ninja-build p7zip-full x11-xserver-utils xdg-utils xvfb
jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        shell: ${{ inputs.shell }}
    env:
      TRACY_ENABLE: "${{ inputs.cmake-config == 'RelWithDebInfo' && 'ON' || 'OFF' }}"
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

          # Building and testing a fork's code is the entire point of this workflow, and
          # the test suite needs system files that can't be redistributed -- which means
          # pull_request_target, which means fork code runs with this repo's secrets.
          # That risk is accepted deliberately; see CAN_WRITE_CACHE above for the part
          # that is *not* accepted (poisoning caches that trusted builds read back).
          allow-unsafe-pr-checkout: true

      - name: Install GCC Problem Matcher
        uses: root-project/gcc-problem-matcher-improved@c45ac8b7c1589268fdef2f7f5772375aa96ab210
        if: ${{ runner.os != 'Windows' }} # See https://github.com/root-project/gcc-problem-matcher-improved/issues/3
        with:
          build-directory: ${{ env.BUILD_DIR }}

      - name: Install MSYS2 Dependencies (Windows)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        if: ${{ runner.os == 'Windows' }}
        with:
          msystem: MINGW64
          update: true
          install: git pkgconf mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake

      - name: Install Mesa
        if: ${{ runner.os == 'Windows' }}
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3.0.0

      - name: Install Dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: brew install pkg-config cmake ninja ccache

        # Skip this step on act due to https://github.com/nektos/act/issues/1849
        # cache-apt-pkgs-action has no restore-only mode, so untrusted runs fall through
        # to the uncached step below rather than being allowed to populate the cache.
      - name: Install Dependencies (Linux)
        if: ${{ !env.ACT && env.CAN_WRITE_CACHE == 'true' && runner.os == 'Linux' }}
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 #v1.6.3
        with:
          packages: ${{ env.APT_PACKAGES }}
          version: 1.2

      - name: Install Dependencies (Linux, uncached)
        if: ${{ (env.ACT || env.CAN_WRITE_CACHE != 'true') && runner.os == 'Linux' }}
        shell: bash
        run: sudo apt-get update -qy && sudo apt-get install -qy ${{ env.APT_PACKAGES }}

      - name: Install CCache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ inputs.archive-name }}-${{ inputs.cmake-config }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }} # Equivalent to (runner.os == 'Windows') ? 'sccache' : 'ccache'
          # Using sccache on Windows due to https://github.com/hendrikmuhs/ccache-action/issues/112
          verbose: 2
          evict-old-files: job
          save: ${{ env.CAN_WRITE_CACHE }}
          # Untrusted runs still restore from the base branch, so they aren't cold;
          # they just don't persist their own objects for a trusted build to link.

      - name: Install Python
        if: ${{ inputs.test-suite }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: ${{ env.CAN_WRITE_CACHE == 'true' && 'pip' || '' }}
          # requirements.txt is attacker-controlled on a fork PR, and the pip cache is
          # keyed by its hash; an empty value disables caching entirely for those runs.
          cache-dependency-path: "${{ github.workspace }}/test/requirements.txt"

      - name: Install Python Dependencies
        if: ${{ inputs.test-suite }}
        shell: bash
        run: |
          pip install -v -r "${{ github.workspace }}/test/requirements.txt"

      - name: Restore Cached Test Files
        if: ${{ inputs.test-suite && inputs.testfiles-cache-key }}
        id: restore-test-files
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            testfiles
            !testfiles/.git
            !testfiles/*.7z
          restore-keys: |
            testfiles
          key: ${{ inputs.testfiles-cache-key }}
          enableCrossOsArchive: true

      - name: Download Test Files
        if: ${{ inputs.test-suite && steps.restore-test-files.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ secrets.TESTFILE_REPO }}"
          token: "${{ secrets.TESTFILE_REPO_TOKEN }}"
          path: "testfiles"
          persist-credentials: false

      - name: Prepare Test Files
        if: ${{ inputs.test-suite && steps.restore-test-files.outputs.cache-hit != 'true' }}
        working-directory: "${{ github.workspace }}/testfiles"
        shell: bash
        run: 7z x "${{ secrets.DSI_NAND_ARCHIVE }}"

      - name: Create Build Directory
        run: mkdir -vp "${{ env.BUILD_DIR }}"

      - name: Configure
        working-directory: "${{ env.BUILD_DIR }}"
        if: ${{ ! inputs.test-suite }}
        run: |
          cmake "${{ github.workspace }}" \
            -Wno-deprecated \
            -DCMAKE_BUILD_TYPE="${{ inputs.cmake-config }}" \
            -DTRACY_ENABLE="${{ env.TRACY_ENABLE }}" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            ${{ inputs.cmake-args }}

      - name: Configure (With Test Suite)
        working-directory: "${{ env.BUILD_DIR }}"
        if: ${{ inputs.test-suite }}
        run: |
          cmake "${{ github.workspace }}" \
            -Wno-deprecated \
            -DCMAKE_BUILD_TYPE="${{ inputs.cmake-config }}" \
            -DTRACY_ENABLE="${{ env.TRACY_ENABLE }}" \
            -DBUILD_TESTING=ON \
            -DARM7_BIOS="${{ env.TESTFILE_DIR }}/${{ secrets.ARM7_BIOS }}" \
            -DARM9_BIOS="${{ env.TESTFILE_DIR }}/${{ secrets.ARM9_BIOS }}" \
            -DARM7_DSI_BIOS="${{ env.TESTFILE_DIR }}/${{ secrets.ARM7_DSI_BIOS }}" \
            -DARM9_DSI_BIOS="${{ env.TESTFILE_DIR }}/${{ secrets.ARM9_DSI_BIOS }}" \
            -DNDS_FIRMWARE="${{ env.TESTFILE_DIR }}/${{ secrets.NDS_FIRMWARE }}" \
            -DDSI_FIRMWARE="${{ env.TESTFILE_DIR }}/${{ secrets.DSI_FIRMWARE }}" \
            -DDSI_NAND="${{ env.TESTFILE_DIR }}/${{ secrets.DSI_NAND }}" \
            -DNDS_ROM="${{ env.TESTFILE_DIR }}/${{ secrets.NDS_ROM }}" \
            -DDSIWARE_ROM="${{ env.TESTFILE_DIR }}/${{ secrets.DSIWARE_ROM }}" \
            -DGBA_ROM="${{ env.TESTFILE_DIR }}/${{ secrets.GBA_ROM }}" \
            -DGBA_SRAM="${{ env.TESTFILE_DIR }}/${{ secrets.GBA_SRAM }}" \
            -DMELONDSDS_INTERNAL_VENV=OFF \
            -DMELONDSDS_INSTALL_TEST_REQUIREMENTS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            ${{ inputs.cmake-args }}

      - name: Build
        working-directory: "${{ env.BUILD_DIR }}"
        run: cmake --build "${{ env.BUILD_DIR }}" --parallel

      # ccache-action publishes a job summary for ccache, but its hasJsonStats()
      # returns false for any variant that isn't ccache, so the Windows legs get
      # nothing. This is the sccache equivalent.
      #
      # Nothing compiles after the build step, so the numbers here are final.
      # Parsing the text output rather than --stats-format=json keeps this working
      # across sccache versions, which have reshaped the JSON more than once.
      - name: Summarize sccache Statistics (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        shell: bash
        run: |
          if ! command -v sccache > /dev/null; then
            echo "sccache is not on PATH; skipping the statistics summary."
            exit 0
          fi

          {
            echo "### sccache Statistics"
            echo
            echo "| Statistic | Value |"
            echo "| --------- | ----- |"

            # Every row is a label and a value separated by a run of spaces. Values
            # themselves contain spaces ("12 MiB", "100.00 %"), so only collapse the
            # first run, and escape pipes so a value can't break out of the table.
            sccache --show-stats \
              | sed -E 's/[[:space:]]{2,}/\t/' \
              | awk -F'\t' 'NF == 2 {
                  gsub(/[|]/, "\\\\|", $1)
                  gsub(/[|]/, "\\\\|", $2)
                  printf "| %s | %s |\n", $1, $2
                }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Artifact Directory
        env:
          CORES_PATH: "${{ env.DIST_DIR }}/${{ inputs.cores-dir }}"
          INFO_PATH: "${{ env.DIST_DIR }}/${{ inputs.info-dir }}"
        run: |
          LIB_EXT=$(grep '^MELONDSDS_LIBRARY_SUFFIX:INTERNAL=' "${{ env.BUILD_DIR }}/CMakeCache.txt" | cut -d'=' -f2- | sed 's/^\.//')
          # Find the cache variable I saved and extract it; I did so exactly for this build workflow

          mkdir -vp "$CORES_PATH" "$INFO_PATH"
          cp -f "${{ env.BUILD_DIR }}/src/libretro/${{ inputs.core-name }}.$LIB_EXT" "$CORES_PATH"
          cp -f "${{ env.BUILD_DIR }}/melondsds_libretro.info" "$INFO_PATH/${{ inputs.core-name }}.info"
          cp -f "${{ env.BUILD_DIR }}/melondsds-LICENSE.txt" "$CORES_PATH"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ inputs.archive-name }}-${{ inputs.cmake-config }}"
          if-no-files-found: error
          path: "${{ env.DIST_DIR }}"

      - name: Run Test Suite (macOS)
        if: ${{ inputs.test-suite && runner.os == 'macOS' }}
        working-directory: "${{ env.BUILD_DIR }}"
        env:
          PYTHONUNBUFFERED: 1
          # Defining TRACY_NO_INVARIANT_CHECK fixes test suite failures on the macos-13 runner;
          # this is fine because we're not taking traces on the CI anyway.
          TRACY_NO_INVARIANT_CHECK: 1
        run: ctest --output-on-failure

      - name: Run Test Suite (Linux)
        if: ${{ inputs.test-suite && runner.os == 'Linux' }}
        working-directory: "${{ env.BUILD_DIR }}"
        env:
          PYTHONUNBUFFERED: 1
        run: xvfb-run ctest --output-on-failure

      - name: Run Test Suite (Windows)
        if: ${{ inputs.test-suite && runner.os == 'Windows' }}
        working-directory: "${{ env.BUILD_DIR }}"
        shell: msys2 {0}
        env:
          PYTHONUNBUFFERED: 1
          MESA_DEBUG: 1
          D3D12_DEBUG: debuglayer
          GLCONTEXT_WIN_LIBGL: "C:/Windows/System32/opengl32.dll"
        run: |
          ctest --output-on-failure
